
services:
  postgres:
    image: postgres:17
    container_name: kitchen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kitchen_user
      POSTGRES_PASSWORD: kitchen_password
      POSTGRES_DB: kitchen_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

